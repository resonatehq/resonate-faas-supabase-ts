name: cd

on:
  release:
    types: [released]

jobs:
  run:
    name: publish

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish Package
      - run: deno publish
